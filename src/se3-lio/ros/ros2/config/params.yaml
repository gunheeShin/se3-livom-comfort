/**:
  ros__parameters:
    imu_topic: "/livox/imu"
    lidar_topic: "/livox/lidar"

    sensors:
      imu:
        acc_cov: 0.1
        gyr_cov: 0.1
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001

      lidar:
        min_range: 0.25
        range_cov: 0.02
        angle_cov: 0.15
        # Keep every Nth raw point (1 = keep all). Raise it when a dense sensor
        # outruns the pipeline -- a 128-beam scanner is ~4x the points of a 32-beam one.
        point_filter_num: 1

      # LiDAR->IMU extrinsic — set for your sensor rig. [quat : w, x, y, z]
      t_exts: [0.0, 0.0, 0.0]
      q_exts: [1.0, 0.0, 0.0, 0.0]

    downsample:
      resolution: 0.5

    max_iter: 4

    verbose: false

    voxel_map:
      resolution: 1.0
      max_layer: 2
      layer_size: [5, 5, 5, 5, 5]
      max_point_size: 1000
      plane_threshold: 0.01

      # Local-map sliding window: evict voxels outside a +/- half_map_size box
      # once the body moves sliding_thresh meters. Bounds RAM.
      map_sliding_en: true
      sliding_thresh: 8.0
      half_map_size: 100