# COMFORT(GrandTour) — FAST-LIVO2 src/FAST-LIVO2/config/GrandTour.yaml 의 LIO 값을 그대로 옮김.
# extrinsic(t_exts/q_exts)은 미션별 calib.json T_imu_lidar 로 tools/se3lio_run.py 가 채운다.
sensors:
  imu:
    acc_cov: 0.5
    gyr_cov: 0.01
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001

  lidar:
    min_range: [0.6, 0.8]   # [Hesai, Livox]: preprocess.blind 0.6 · Livox 몸통 컷 0.8(merge_livox.py 와 같음). 코어 병합(--lidar multi)에서만 라이다별로 듣고, .bin 경로는 첫 값
    point_filter_num: 1
    # [Hesai XT32, Livox Mid-360] — 병합 스캔의 ring 200 이 Livox(idx 1). FL2 는 둘 다 dept_err 0.02 · beam_err 0.05.
    # Hesai 데이터시트 0.005 는 못 쓴다: 대응점 게이트(3σ)가 좁아져 CON-3 Hesai 단독이 9.3 cm 로 드리프트(2026-09-14).
    # Livox 는 데이터시트(≤0.02 @10 m · <0.15°).
    range_cov: [0.02, 0.02]    # m
    angle_cov: [0.05, 0.15]    # deg

downsample:
  resolution: 0.1           # preprocess.filter_size_surf

max_iter: 5                 # lio.max_iterations

voxel_map:
  resolution: 0.4           # lio.voxel_size
  max_layer: 2
  layer_size: [5, 5, 5, 5, 5]   # lio.layer_init_num
  max_point_size: 100       # lio.max_points_num
  plane_threshold: 0.001    # lio.min_eigen_value 는 1e-4. se3-lio 는 실제 점 다운샘플(FL2 는 VoxelGrid 평균점)이라 잡음이 커 문턱을 올려야 같은 평면이 뽑힌다 — ARC-1 A/B 2026-09-14

  map_sliding_en: false
  sliding_thresh: 8.0
  half_map_size: 100

# 점-평면 잔차 분산 바닥값. FL2 는 R_inv = 1/(0.001 + σ) (voxel_map.cpp) — se3-lio 원본은 0.
# ARC-3 2.07→1.58 · HEAP-1 1.78→1.12 cm (2026-09-14 코드 A/B); 디스큐 공분산·초기화는 무영향.
residual_floor: 0.001

# 카메라(FAST-LIVO2식 sparse-direct photometric 갱신). enable 이 꺼지면 사진을 읽지 않고 LiDAR 갱신 경로는 그대로다.
# run_se3lio.sh --cam 이 이미지 스탬프를 에폭 경계로 쓰고, enable 이 켜져 있으면 calib.json 의 K·D·T_cam_lidar 로 카메라를 채운다.
# 값은 GrandTour.yaml vio: 를 따른다. grid_size 는 FL2 규칙(grid_size<=10 이면 height/17)으로 1080/17.
# exposure 추정(exposure_estimate_en)은 아직 없다. raycast·inverse composition 은 FL2 도 끈다.
visual:
  enable: false
  max_iter: 5               # vio.max_iterations
  outlier_threshold: 500    # vio.outlier_threshold
  img_point_cov: 1000       # vio.img_point_cov
  patch_size: 8             # vio.patch_size
  pyramid_levels: 4         # vio.patch_pyrimid_level
  grid_size: 63             # 1080/17
