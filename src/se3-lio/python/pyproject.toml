[build-system]
requires = ["scikit_build_core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "se3-lio"
version = "0.2.0"
description = "SE(3) LiDAR-Inertial Odometry Python bindings"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Gunhee Shin", email = "gunmaplehee@gmail.com" },
]
license = { text = "GPL-2.0" }
keywords = ["LiDAR", "IMU", "Odometry", "SLAM", "LIO"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "tqdm",
    "rosbags>=0.9",
]

[project.urls]
Homepage = "https://se3-lio.github.io"
Repository = "https://github.com/url-kaist/se3-lio"

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
build.verbose = false
cmake.version = ">=3.16,<4"
editable.mode = "redirect"
editable.rebuild = true
editable.verbose = true
wheel.install-dir = "se3_lio/pybind/"
sdist.exclude = [
    ".venv*",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
